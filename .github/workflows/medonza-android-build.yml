name: MEDONZA Android APK
on:
  workflow_dispatch:
  push:
    branches: [ 'agent/medonza-apk-build' ]
    paths:
      - 'medonza-android/**'
      - '.github/workflows/medonza-android-build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        working-directory: medonza-android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: medonza-app-debug
          path: medonza-android/app/build/outputs/apk/debug/app-debug.apk
